  <line x1="185" y1="332" x2="235" y2="337" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" />
  <line x1="272" y1="305" x2="327" y2="300" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" />
  <line x1="272" y1="321" x2="327" y2="316" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" />
  <line x1="277" y1="337" x2="327" y2="332" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" />

