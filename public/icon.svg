  <polygon points="256,380 260,390 270,390 262,396 265,406 256,400 247,406 250,396 242,390 252,390" fill="url(#goldGrad)" />
  <polygon points="190,360 193,368 201,368 195,373 197,381 190,376 183,381 185,373 179,368 187,368" fill="url(#goldGrad)" />
  <polygon points="322,360 325,368 333,368 327,373 329,381 322,376 315,381 317,373 311,368 319,368" fill="url(#goldGrad)" />

